name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A tag is refused before anything is built unless it is v{Directory.Build.props version} and CHANGELOG.md
  # has a dated section for that version. See docs/RELEASING.md.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      numeric: ${{ steps.version.outputs.numeric }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # A tag builds exactly the declared version; a manual run builds <version>-dev.<run>. The installer's
      # file version has to be four numbers, so a prerelease suffix is dropped there.
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 tools/changelog.py release-check "$GITHUB_REF_NAME"
            version=$(python3 tools/changelog.py version)
          else
            python3 tools/changelog.py check
            version="$(python3 tools/changelog.py version)-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "numeric=${version%%-*}.0" >> "$GITHUB_OUTPUT"

  publish:
    name: publish (${{ matrix.rid }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64, profile: linux-x64 }
          - { os: windows-latest, rid: win-x64, profile: win-x64 }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Both executables go into one folder: `sharpmuterm --window` looks for the window beside itself.
      - name: Publish single-file
        shell: bash
        run: |
          dotnet publish src/SharpMUTerm.Tui/SharpMUTerm.Tui.csproj \
            -p:PublishProfile=${{ matrix.profile }} -p:Version=${{ needs.version.outputs.version }} \
            -o publish/${{ matrix.rid }}
          dotnet publish src/SharpMUTerm.Avalonia/SharpMUTerm.Avalonia.csproj \
            -p:PublishProfile=${{ matrix.profile }} -p:Version=${{ needs.version.outputs.version }} \
            -o publish/${{ matrix.rid }}

      # The window's own demo render, from the published single file, before anything is packaged.
      - name: Smoke test
        shell: bash
        run: |
          cd publish/${{ matrix.rid }}
          ./sharpmuterm --help > /dev/null </dev/null
          ./sharpmuterm-window --demo-config --render-png smoke.png </dev/null
          test -s smoke.png
          rm smoke.png

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf dist/sharpmuterm-${{ matrix.rid }}.tar.gz -C publish/${{ matrix.rid }} sharpmuterm sharpmuterm-window
          packaging/linux/build-appimage.sh publish/${{ matrix.rid }} ${{ needs.version.outputs.version }} dist

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          (cd publish/${{ matrix.rid }} && 7z a ../../dist/sharpmuterm-${{ matrix.rid }}.zip sharpmuterm.exe sharpmuterm-window.exe)
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$iscc" ]; then
            choco install innosetup --no-progress -y
          fi
          "$iscc" \
            "/DAppVersion=${{ needs.version.outputs.version }}" \
            "/DNumericVersion=${{ needs.version.outputs.numeric }}" \
            "/DPublishDir=$(cygpath -w "$PWD/publish/${{ matrix.rid }}")" \
            "/DOutputDir=$(cygpath -w "$PWD/dist")" \
            packaging/windows/sharpmuterm.iss

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sharpmuterm-${{ matrix.rid }}
          path: dist/*

  # Serialize release creation in a single downstream job so the two matrix jobs don't race
  # softprops/action-gh-release on the same tag.
  release:
    needs: [version, publish]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Release notes from CHANGELOG.md
        run: python3 tools/changelog.py notes ${{ needs.version.outputs.version }} > release-notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: SharpMUTerm ${{ needs.version.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          files: artifacts/*
