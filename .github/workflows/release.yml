name: Release

# A release published on the Releases page builds its tag and attaches the packages to it.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The version is the tag (MinVer; see Directory.Build.props). See docs/RELEASING.md.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # A tag builds exactly its own version; a manual run builds what MinVer makes of the commit, e.g.
      # 0.2.1-alpha.0.5.
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::the tag $GITHUB_REF_NAME is not v<semantic version>, e.g. v1.2.3 or v1.3.0-beta.1"
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
          else
            python3 tools/changelog.py check
            dotnet tool install --tool-path "$RUNNER_TEMP/minver" minver-cli --version 8.0.0
            version=$("$RUNNER_TEMP/minver/minver" --tag-prefix v --minimum-major-minor 0.1 --verbosity warn)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    name: publish (${{ matrix.rid }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64, profile: linux-x64 }
          - { os: windows-latest, rid: win-x64, profile: win-x64 }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Both executables go into one folder: `sharpmuterm --window` looks for the window beside itself.
      - name: Publish single-file
        shell: bash
        run: |
          dotnet publish src/SharpMUTerm.Tui/SharpMUTerm.Tui.csproj \
            -p:PublishProfile=${{ matrix.profile }} -p:MinVerVersionOverride=${{ needs.version.outputs.version }} \
            -o publish/${{ matrix.rid }}
          dotnet publish src/SharpMUTerm.Avalonia/SharpMUTerm.Avalonia.csproj \
            -p:PublishProfile=${{ matrix.profile }} -p:MinVerVersionOverride=${{ needs.version.outputs.version }} \
            -o publish/${{ matrix.rid }}

      # The window's own demo render, from the published single file, before anything is packaged.
      - name: Smoke test
        shell: bash
        run: |
          cd publish/${{ matrix.rid }}
          ./sharpmuterm --help > /dev/null </dev/null
          ./sharpmuterm-window --demo-config --render-png smoke.png </dev/null
          test -s smoke.png
          rm smoke.png

      # vpk, Velopack's packager, makes the installer and the update feed the client reads (VelopackUpdates): each
      # release carries releases.<channel>.json and a full .nupkg, and an installed copy asks the latest releases for
      # them. Full packages only (no deltas), so a re-run builds the same files.
      - name: Install vpk
        shell: bash
        run: dotnet tool install --global vpk --version 1.2.161

      # The AppImage: our AppDir, with Velopack's updater and manifest added beside the executables. The .tar.gz stays
      # for anyone who wants the two files alone; it does not update itself.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y squashfs-tools
          mkdir -p dist
          tar -czf dist/sharpmuterm-${{ matrix.rid }}.tar.gz -C publish/${{ matrix.rid }} sharpmuterm sharpmuterm-window
          packaging/linux/build-appdir.sh publish/${{ matrix.rid }} appdir/SharpMUTerm.AppDir
          vpk pack -u SharpMUTerm -v ${{ needs.version.outputs.version }} -r ${{ matrix.rid }} \
            -p appdir/SharpMUTerm.AppDir -e sharpmuterm-window \
            --packTitle SharpMUTerm --packAuthors "Harry Cordewener" -i packaging/icons/sharpmuterm.png \
            --delta None -o releases
          cp releases/*.nupkg releases/*.AppImage releases/releases.linux.json dist/

      # Setup.exe installs for this user under %LocalAppData%\SharpMUTerm; the portable .zip carries the same updater.
      # What the old installer offered beside the files (toast id, PATH, the Nerd Font) is done by the window's own
      # install hooks (VelopackHooks).
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp packaging/icons/sharpmuterm.png publish/${{ matrix.rid }}/
          cp LICENSE publish/${{ matrix.rid }}/LICENSE.txt
          vpk pack -u SharpMUTerm -v ${{ needs.version.outputs.version }} -r ${{ matrix.rid }} \
            -p publish/${{ matrix.rid }} -e sharpmuterm-window.exe \
            --packTitle SharpMUTerm --packAuthors "Harry Cordewener" -i packaging/icons/sharpmuterm.ico \
            --aumid SharpMUTerm.Window --shortcuts StartMenuRoot --delta None -o releases
          cp releases/*.nupkg releases/*-Setup.exe releases/*-Portable.zip releases/releases.win.json dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sharpmuterm-${{ matrix.rid }}
          path: dist/*

  # One job attaches every package, after both matrix jobs have built theirs.
  release:
    needs: [version, publish]
    # A manual run, even against a tag, keeps its packages as workflow artifacts.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # --clobber replaces a package of the same name, so re-running the workflow is safe.
      - name: Attach the packages
        run: |
          gh release upload "$TAG" artifacts/* --clobber
          count=$(gh release view "$TAG" --json assets -q '.assets | length')
          test "$count" -ge 8 || { echo "::error::the release has $count packages, expected 8"; exit 1; }

      # Notes written on the Releases page are kept. Empty notes get the version's changelog section, else
      # [Unreleased]; with neither, they stay empty.
      - name: Release notes from CHANGELOG.md
        env:
          BODY: ${{ github.event.release.body }}
        run: |
          if [ -n "$BODY" ]; then exit 0; fi
          python3 tools/changelog.py notes ${{ needs.version.outputs.version }} > release-notes.md
          if [ -s release-notes.md ]; then gh release edit "$TAG" --notes-file release-notes.md; fi
